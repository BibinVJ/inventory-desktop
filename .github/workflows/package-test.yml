name: Package Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging

jobs:
  package-test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Build Application
        run: npm run build

      - name: Package Application
        run: npm run package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-app-${{ matrix.os }}
          path: |
            dist/
            !dist/**/*.map
          retention-days: 7